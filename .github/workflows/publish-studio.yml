name: "Publish pages"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  publish-studio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run prepare-packages

      # Runs after the build: replicad-evaluator and replicad-cli resolve
      # replicad through its published entry points, so they need dist/.
      - name: Run the tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build the studio
        run: npm run build --workspace=studio

      - name: Build the example app
        run: npm run build --workspace=replicad-app-example

      - name: Publish the studio
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_ACCESS }}
          accountId: d0e0387dd16b671a301d1ce6e7b73609
          projectName: replicad-studio
          directory: packages/studio/dist
          wranglerVersion: "3"

      - name: Publish the example app
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_ACCESS }}
          accountId: d0e0387dd16b671a301d1ce6e7b73609
          projectName: replicad-example-app
          directory: packages/replicad-app-example/build
          wranglerVersion: "3"
