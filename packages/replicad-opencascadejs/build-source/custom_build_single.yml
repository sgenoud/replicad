#@ load("@ytt:data", "data")

mainBuild:
  name: replicad_single.js
  bindings: #@ data.values.bindings
  #! Pre-evaluate global constructors to reduce single-threaded startup work.
  #! Pthread workers must instead run Embind registrations at runtime.
  emccFlags: #@ data.values.buildFlags + ["-sEVAL_CTORS=2"]

additionalCppFiles: #@ data.values.additionalCppFiles
