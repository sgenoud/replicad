#@ load("@ytt:data", "data")

mainBuild:
  name: replicad_multi.js
  bindings: #@ data.values.bindings
  emccFlags: #@ data.values.buildFlags + ["-pthread", "-sUSE_PTHREADS=1", "-sPTHREAD_POOL_SIZE=navigator.hardwareConcurrency", "-sSHARED_MEMORY=1", "-sENVIRONMENT=web,worker,node"]

additionalCppFiles:
  - wrappers/shape-hasher.cpp
  - wrappers/mesh-extractor.cpp
  - wrappers/edge-mesh-extractor.cpp
  - wrappers/brep-io.cpp
  - wrappers/geom2d-io.cpp
